<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="18" font-weight="bold" fill="#111827">Figure 3: Per-set apply (the data fence)</text>

  <rect x="320" y="40" width="180" height="30" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="410" y="60" font-size="12.5" text-anchor="middle" fill="#111827" font-family="monospace">apply_set(mode, set)</text>
  <line x1="410" y1="70" x2="410" y2="84" stroke="#475569" stroke-width="2" marker-end="url(#ah4)"/>

  <!-- persistent? -->
  <polygon points="410,84 486,112 410,140 334,112" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="410" y="116" font-size="12" font-weight="bold" text-anchor="middle" fill="#7c2d12">set.persistent?</text>
  <line x1="486" y1="112" x2="580" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#ah4)"/>
  <text x="533" y="104" font-size="11" text-anchor="middle" fill="#6b7280">yes</text>
  <rect x="582" y="90" width="230" height="44" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="697" y="110" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">mount existing (hands-off)</text>
  <text x="697" y="126" font-size="10.5" text-anchor="middle" fill="#1f2937">never wiped by any mode (I2)</text>

  <!-- full? -->
  <line x1="410" y1="140" x2="410" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#ah4)"/>
  <text x="422" y="158" font-size="11" fill="#6b7280">no</text>
  <polygon points="410,166 486,194 410,222 334,194" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="410" y="198" font-size="12" font-weight="bold" text-anchor="middle" fill="#7c2d12">mode == full?</text>
  <line x1="334" y1="194" x2="250" y2="194" stroke="#475569" stroke-width="2" marker-end="url(#ah4)"/>
  <text x="292" y="186" font-size="11" text-anchor="middle" fill="#6b7280">yes</text>
  <rect x="20" y="172" width="230" height="44" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="135" y="192" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f1d1d">wipe + create + populate</text>
  <text x="135" y="208" font-size="10.5" text-anchor="middle" fill="#1f2937">the one destructive path (opt-in)</text>

  <!-- storage_check -->
  <line x1="410" y1="222" x2="410" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#ah4)"/>
  <text x="422" y="240" font-size="11" fill="#6b7280">no</text>
  <rect x="320" y="250" width="180" height="32" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="410" y="271" font-size="12" text-anchor="middle" fill="#111827" font-family="monospace">storage_check(set)</text>
  <line x1="410" y1="282" x2="410" y2="306" stroke="#475569" stroke-width="2" marker-end="url(#ah4)"/>

  <!-- health? -->
  <polygon points="410,306 482,340 410,374 338,340" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="410" y="345" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#7c2d12">health?</text>

  <!-- healthy -->
  <path d="M360,360 C220,400 140,405 125,426" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#ah4)"/>
  <text x="205" y="388" font-size="11" fill="#6b7280">healthy</text>
  <rect x="40" y="428" width="170" height="46" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
  <text x="125" y="449" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">refresh + preserve</text>
  <text x="125" y="465" font-size="10.5" text-anchor="middle" fill="#1f2937">data kept</text>

  <!-- blank -->
  <line x1="410" y1="374" x2="410" y2="426" stroke="#475569" stroke-width="1.8" marker-end="url(#ah4)"/>
  <text x="422" y="404" font-size="11" fill="#6b7280">blank</text>
  <rect x="320" y="428" width="180" height="46" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
  <text x="410" y="449" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">create + populate</text>
  <text x="410" y="465" font-size="10.5" text-anchor="middle" fill="#1f2937">safe (nothing to lose)</text>

  <!-- broken -> R -->
  <path d="M460,358 C560,392 620,400 645,420" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#ah4)"/>
  <text x="560" y="384" font-size="11" fill="#6b7280">broken / mismatch</text>
  <polygon points="660,420 742,454 660,488 578,454" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="660" y="450" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#7c2d12">mode==auto</text>
  <text x="660" y="466" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#7c2d12">&amp; OS set?</text>

  <!-- R yes -> self heal -->
  <line x1="660" y1="488" x2="660" y2="516" stroke="#475569" stroke-width="1.8" marker-end="url(#ah4)"/>
  <text x="672" y="508" font-size="11" fill="#6b7280">yes</text>
  <rect x="540" y="518" width="250" height="48" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
  <text x="665" y="539" font-size="12" font-weight="bold" text-anchor="middle" fill="#7c2d12">recreate + populate</text>
  <text x="665" y="555" font-size="10.5" text-anchor="middle" fill="#1f2937">self-heal (OS only, I4)</text>

  <!-- R no -> HALT -->
  <path d="M578,454 C470,470 430,495 415,516" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#ah4)"/>
  <text x="470" y="486" font-size="11" fill="#6b7280">no (sync, or data set)</text>
  <rect x="290" y="518" width="240" height="48" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="410" y="539" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f1d1d">HALT + report</text>
  <text x="410" y="555" font-size="10.5" text-anchor="middle" fill="#1f2937">never wipe data (I1, I3)</text>
</svg>
