<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="18" font-weight="bold" fill="#111827">Figure 1: Top-level dispatch (legacy and sanitize bypass the model)</text>

  <rect x="300" y="40" width="220" height="30" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="410" y="60" font-size="11.5" text-anchor="middle" fill="#111827">resolve_mode (group&#8594;node, default auto)</text>
  <line x1="410" y1="70" x2="410" y2="86" stroke="#475569" stroke-width="2" marker-end="url(#ah2)"/>

  <!-- legacy fork -->
  <polygon points="410,86 500,108 410,130 320,108" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="410" y="105" font-size="11" font-weight="bold" text-anchor="middle" fill="#7c2d12">install_mode</text>
  <text x="410" y="119" font-size="11" font-weight="bold" text-anchor="middle" fill="#7c2d12">== legacy?</text>
  <line x1="500" y1="108" x2="586" y2="108" stroke="#475569" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="543" y="101" font-size="10.5" text-anchor="middle" fill="#6b7280">yes</text>
  <rect x="588" y="86" width="224" height="44" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="700" y="105" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#7c2d12">old pre/part/post (diskfull)</text>
  <text x="700" y="121" font-size="10" text-anchor="middle" fill="#1f2937">new installer bypassed; full unpack</text>

  <line x1="410" y1="130" x2="410" y2="148" stroke="#475569" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="422" y="143" font-size="10.5" fill="#6b7280">no</text>

  <!-- sanitize fork -->
  <polygon points="410,148 496,170 410,192 324,170" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="410" y="167" font-size="11" font-weight="bold" text-anchor="middle" fill="#7c2d12">install_mode</text>
  <text x="410" y="181" font-size="11" font-weight="bold" text-anchor="middle" fill="#7c2d12">== sanitize?</text>
  <line x1="324" y1="170" x2="252" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="288" y="163" font-size="10.5" text-anchor="middle" fill="#6b7280">yes</text>
  <rect x="40" y="148" width="210" height="44" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="145" y="167" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#7f1d1d">secure erase all disks</text>
  <text x="145" y="183" font-size="10" text-anchor="middle" fill="#1f2937">node ready for a new tenant</text>

  <line x1="410" y1="192" x2="410" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#ah2)"/>
  <text x="422" y="206" font-size="10.5" fill="#6b7280">no</text>

  <!-- mode switch -->
  <polygon points="410,212 470,240 410,268 350,240" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="410" y="245" font-size="14" font-weight="bold" text-anchor="middle" fill="#7c2d12">mode?</text>

  <!-- five outcome boxes -->
  <g font-size="11">
    <rect x="19"  y="330" width="150" height="78" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="94"  y="350" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a" font-family="monospace">memboot</text>
    <text x="94"  y="370" text-anchor="middle" fill="#1f2937">populate RAM root</text>
    <text x="94"  y="386" text-anchor="middle" fill="#1f2937">(OS in RAM)</text>

    <rect x="177" y="330" width="150" height="78" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="252" y="350" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#7c2d12" font-family="monospace">local</text>
    <text x="252" y="370" text-anchor="middle" fill="#1f2937">mount existing;</text>
    <text x="252" y="386" text-anchor="middle" fill="#1f2937">boot or halt</text>

    <rect x="335" y="330" width="150" height="78" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="410" y="350" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#7f1d1d" font-family="monospace">full</text>
    <text x="410" y="370" text-anchor="middle" fill="#1f2937">wipe + create +</text>
    <text x="410" y="386" text-anchor="middle" fill="#1f2937">populate</text>

    <rect x="493" y="330" width="150" height="78" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="568" y="350" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#14532d" font-family="monospace">sync</text>
    <text x="568" y="370" text-anchor="middle" fill="#1f2937">converge; never wipe</text>
    <text x="568" y="386" text-anchor="middle" fill="#1f2937">(halt if broken)</text>

    <rect x="651" y="330" width="150" height="78" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2.5"/>
    <text x="726" y="350" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#14532d" font-family="monospace">auto &#9733;</text>
    <text x="726" y="370" text-anchor="middle" fill="#1f2937">sync + auto-repair</text>
    <text x="726" y="386" text-anchor="middle" fill="#1f2937">(see Fig 2)</text>
  </g>

  <g stroke="#475569" stroke-width="1.8" fill="none">
    <path d="M372,254 C220,290 120,292 94,328" marker-end="url(#ah2)"/>
    <path d="M386,260 C300,294 260,296 252,328" marker-end="url(#ah2)"/>
    <path d="M410,268 L410,328" marker-end="url(#ah2)"/>
    <path d="M434,260 C520,294 560,296 568,328" marker-end="url(#ah2)"/>
    <path d="M448,254 C600,290 700,292 726,328" marker-end="url(#ah2)"/>
  </g>
</svg>
