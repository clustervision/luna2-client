<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 450" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="18" font-weight="bold" fill="#111827">Figure 2: the <tspan font-family="monospace">auto</tspan> decision tree</text>

  <rect x="270" y="44" width="180" height="32" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="360" y="65" font-size="13" text-anchor="middle" fill="#111827" font-family="monospace">mode = auto</text>
  <line x1="360" y1="76" x2="360" y2="92" stroke="#475569" stroke-width="2" marker-end="url(#ah3)"/>

  <!-- diamond 1 -->
  <polygon points="360,94 432,130 360,166 288,130" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="360" y="127" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#7c2d12">OS layout</text>
  <text x="360" y="143" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#7c2d12">declared?</text>

  <!-- NO -> memboot -->
  <line x1="432" y1="130" x2="518" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#ah3)"/>
  <text x="470" y="122" font-size="11" text-anchor="middle" fill="#6b7280">no</text>
  <rect x="520" y="106" width="200" height="48" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="620" y="128" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a" font-family="monospace">memboot</text>
  <text x="620" y="145" font-size="11" text-anchor="middle" fill="#1f2937">stateless fallback</text>

  <!-- YES -> discover -->
  <line x1="360" y1="166" x2="360" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#ah3)"/>
  <text x="372" y="186" font-size="11" fill="#6b7280">yes</text>
  <rect x="280" y="198" width="160" height="34" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="360" y="219" font-size="12" text-anchor="middle" fill="#111827">discover eligible disks</text>
  <line x1="360" y1="232" x2="360" y2="258" stroke="#475569" stroke-width="2" marker-end="url(#ah3)"/>

  <!-- diamond 2 -->
  <polygon points="360,258 452,302 360,346 268,302" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="360" y="298" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#7c2d12">disks satisfy</text>
  <text x="360" y="314" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#7c2d12">layout?</text>

  <!-- NO -> HALT -->
  <line x1="268" y1="302" x2="232" y2="302" stroke="#475569" stroke-width="2" marker-end="url(#ah3)"/>
  <text x="250" y="294" font-size="11" text-anchor="middle" fill="#6b7280">no</text>
  <rect x="20" y="276" width="212" height="52" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="126" y="298" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#7f1d1d">HALT + report</text>
  <text x="126" y="315" font-size="10.5" text-anchor="middle" fill="#1f2937">0 / too few disks = fault (never memboot)</text>

  <!-- YES -> apply -->
  <line x1="360" y1="346" x2="360" y2="378" stroke="#475569" stroke-width="2" marker-end="url(#ah3)"/>
  <text x="372" y="368" font-size="11" fill="#6b7280">yes</text>
  <rect x="250" y="380" width="220" height="50" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
  <text x="360" y="402" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#14532d">for each set: apply_set(auto)</text>
  <text x="360" y="419" font-size="11" text-anchor="middle" fill="#1f2937">see Figure 3</text>
</svg>
