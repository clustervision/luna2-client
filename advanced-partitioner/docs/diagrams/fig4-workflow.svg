<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 780" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
    <marker id="ah5d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="18" font-weight="bold" fill="#111827">Figure 4. Installer workflow: boot → pre / part / post</text>

  <!-- boot chain -->
  <rect x="30" y="50" width="540" height="40" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="300" y="68" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">PXE / iPXE  →  dracut 95luna  (luna2-start.sh)</text>
  <text x="300" y="83" font-size="10.5" text-anchor="middle" fill="#374151">TPM token · GET /boot/install/&lt;node&gt; → install.sh · retry + shell-drop on failure</text>
  <line x1="300" y1="90" x2="300" y2="108" stroke="#475569" stroke-width="2" marker-end="url(#ah5)"/>

  <rect x="30" y="110" width="540" height="40" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="300" y="128" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">install.sh  (Luna template)</text>
  <text x="300" y="143" font-size="10.5" text-anchor="middle" fill="#374151">inline inputs (install_mode, storage, osimage-filter) → /tmp/install_files/runtime/</text>
  <line x1="300" y1="150" x2="300" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#ah5)"/>

  <text x="300" y="183" font-size="10.5" text-anchor="middle" fill="#6b7280" font-style="italic">prescript / partscript / postscript = one-line shims → lpart-phase &lt;phase&gt; → lpart-node-installer --phase &lt;phase&gt;</text>

  <!-- PRE -->
  <rect x="30" y="196" width="540" height="74" rx="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="48" y="216" font-size="13" font-weight="bold" fill="#1e3a8a" font-family="monospace">PRE: --phase pre</text>
  <text x="48" y="236" font-size="11" fill="#1f2937">• create /tmp/install_files/{runtime,logs}</text>
  <text x="48" y="254" font-size="11" fill="#1f2937">• write /lunatmp/skip_unpack  (stand down Luna's legacy unpack)</text>
  <line x1="300" y1="270" x2="300" y2="286" stroke="#475569" stroke-width="2" marker-end="url(#ah5)"/>

  <!-- PART -->
  <rect x="30" y="288" width="540" height="116" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="48" y="308" font-size="13" font-weight="bold" fill="#14532d" font-family="monospace">PART: --phase part   (the model, §4)</text>
  <text x="48" y="328" font-size="11" fill="#1f2937">• resolve inputs from daemon: install_mode + storage (layout)</text>
  <text x="48" y="346" font-size="11" fill="#1f2937">• storage decision per install_mode →  lpart-storage-prepare</text>
  <text x="64" y="363" font-size="10.5" fill="#374151">auto/sync use lpart-storage-check as the health probe (create / repair / mount)</text>
  <text x="48" y="381" font-size="11" fill="#1f2937">• lay down OS image →  lpart-osimage-install (sync+preserve | full)</text>
  <text x="64" y="397" font-size="10.5" fill="#374151">memboot → RAM root · local → verify only (lpart-storage-check)</text>
  <line x1="300" y1="404" x2="300" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#ah5)"/>

  <!-- POST -->
  <rect x="30" y="422" width="540" height="92" rx="9" fill="#fef9c3" stroke="#b45309" stroke-width="1.6"/>
  <text x="48" y="442" font-size="13" font-weight="bold" fill="#7c2d12" font-family="monospace">POST: --phase post</text>
  <text x="48" y="462" font-size="11" fill="#1f2937">• write fstab</text>
  <text x="48" y="480" font-size="11" fill="#1f2937">• lpart-bootloader-finalise: UEFI GRUB + NVRAM  (skipped for memboot)</text>
  <text x="48" y="498" font-size="11" fill="#1f2937">• signal Luna: install complete  (drives node install-state)</text>
  <line x1="300" y1="514" x2="300" y2="530" stroke="#475569" stroke-width="2" marker-end="url(#ah5)"/>

  <!-- running OS -->
  <rect x="150" y="532" width="300" height="38" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="300" y="556" font-size="12" text-anchor="middle" fill="#111827" font-weight="bold">reboot → running OS  (or RAM root for memboot)</text>

  <!-- observability rail -->
  <rect x="600" y="196" width="236" height="318" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="718" y="220" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Observability (all phases)</text>

  <rect x="616" y="236" width="204" height="74" rx="7" fill="#fff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="718" y="256" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">TUI dashboard</text>
  <text x="718" y="274" font-size="10" text-anchor="middle" fill="#374151">lpart-node-installer: live</text>
  <text x="718" y="288" font-size="10" text-anchor="middle" fill="#374151">per-stage status</text>
  <text x="718" y="302" font-size="10" text-anchor="middle" fill="#374151">(--no-tui = plain scroll)</text>

  <rect x="616" y="320" width="204" height="58" rx="7" fill="#fff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="718" y="340" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Logs</text>
  <text x="718" y="358" font-size="10" text-anchor="middle" fill="#374151">console +</text>
  <text x="718" y="372" font-size="10" text-anchor="middle" fill="#374151">/tmp/install_files/logs/&lt;phase&gt;.log</text>

  <rect x="616" y="388" width="204" height="64" rx="7" fill="#fff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="718" y="408" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">syslog → controller</text>
  <text x="718" y="426" font-size="9.5" text-anchor="middle" fill="#374151">/var/log/cluster-messages/</text>
  <text x="718" y="440" font-size="9.5" text-anchor="middle" fill="#374151">&lt;host&gt;.cluster.messages</text>

  <!-- dashed feeds from phases to rail -->
  <g stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3" fill="none">
    <path d="M570,233 L598,233" marker-end="url(#ah5d)"/>
    <path d="M570,346 L598,346" marker-end="url(#ah5d)"/>
    <path d="M570,468 L598,468" marker-end="url(#ah5d)"/>
  </g>

  <!-- legacy branch -->
  <rect x="30" y="600" width="806" height="58" rx="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="48" y="622" font-size="12.5" font-weight="bold" fill="#7f1d1d" font-family="monospace">install_mode = legacy  (bypass)</text>
  <text x="48" y="642" font-size="11" fill="#1f2937">install.sh runs the ORIGINAL bash pre/part/post (diskfull) and a FULL OS unpack with osimage-filter omitted. lpart-node-installer / the §4 model are not used.</text>

  <text x="30" y="690" font-size="10" fill="#6b7280">Binaries: lpart-node-installer (orchestrator) · lpart-storage-prepare · lpart-storage-check · lpart-osimage-install · lpart-bootloader-finalise.  (lpart-discover removed.)</text>
</svg>
